name: Build article listings

# articles.json 을 저장하면 index.html / research.html / research-desk.html 을
# 다시 만들어 커밋합니다. 대표님은 json 만 고치면 됩니다.
#
# 무한 루프 방지: 아래 paths 에 HTML 이 없으므로, 이 워크플로가 만든 커밋은
# 자기 자신을 다시 실행시키지 않습니다.

on:
  push:
    branches: [main]
    paths:
      - 'articles.json'
      - 'build_site.py'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:        # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 실패하면 여기서 멈춥니다. 잘못된 json 이 사이트에 반영되지 않습니다.
      - name: Rebuild from articles.json
        run: python build_site.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- index.html research.html research-desk.html)" ]; then
            echo "변경 없음. 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html research.html research-desk.html
          git commit -m "Rebuild article listings from articles.json"
          git push
