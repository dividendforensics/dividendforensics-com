<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="720" height="1280"></canvas>
<script>
const T=8.0, BPM=120;
const gl=document.getElementById('c').getContext('webgl',{preserveDrawingBuffer:true});
const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs=`precision highp float;uniform vec2 R;uniform float a,pulse;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,s=.5;for(int i=0;i<5;i++){v+=s*n(p);p*=2.02;s*=.5;}return v;}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*R)/R.y*2.;
 float r=length(uv);
 vec2 c=vec2(cos(a),sin(a))*.9;
 vec2 q=vec2(fbm(uv*1.4+c),fbm(uv*1.4-c.yx+3.1));
 float f=fbm(uv*1.6+2.2*q+vec2(sin(a),cos(a))*.7);
 vec3 col=mix(vec3(.02,.03,.12),vec3(.9,.25,.55),smoothstep(.25,.85,f));
 col=mix(col,vec3(.1,.85,.95),smoothstep(.5,1.,q.x*q.y*2.2));
 float ring=exp(-pow((r-(.35+.5*pulse))*6.,2.));
 col+=vec3(1.,.8,.5)*ring*(.6+.8*pulse);
 col*=1.-.35*r*r;col+=pulse*.08;
 gl_FragColor=vec4(pow(col,vec3(.9)),1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
 if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
window.render=function(t){
 const beat=(t*BPM/60)%1, pulse=Math.exp(-7*beat);
 gl.viewport(0,0,720,1280);
 gl.uniform2f(gl.getUniformLocation(pr,'R'),720,1280);
 gl.uniform1f(gl.getUniformLocation(pr,'a'),2*Math.PI*t/T);
 gl.uniform1f(gl.getUniformLocation(pr,'pulse'),pulse);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);};
window.ready=true;
</script>
