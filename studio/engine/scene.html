<script type="module">
import * as THREE from 'three';

// ---------- config ----------
const qs=new URLSearchParams(location.search);

  if(!r.ok)continue;const t=await r.text();const m=t.match(/font-family:\s*['"]?([^;'"]+)['"]?;/);
  const l=document.createElement('link');l.rel='stylesheet';l.href=u;document.head.appendChild(l);
  FONT_FAMS.push({fam:m[1].trim(),w:w==='index'?400:+w});break;}}
const DISPLAY=`%spx ${FONT_FAMS.map(f=>`"${f.fam}"`).join(',')},"Black Han Sans","Pretendard",sans-serif`, B9='900 %spx "Pretendard",sans-serif', B7='700 %spx "Pretendard",sans-serif';
const F=(font,size)=>font.replace('%s',size);
const allText=[...cfg.title,cfg.pick,cfg.cta,...cfg.entries.map(e=>e.name+(e.quip||'')),
  '0123456789위탈락최후의개누가살아남을까생존남은GO!초·/…결투단판HP . : ? % + - K.O 🏆👇🥈🥉👑 아슬'].join('');
await Promise.all([...FONT_FAMS.map(f=>document.fonts.load(`${f.w} 80px "${f.fam}"`,allText)),document.fonts.load('80px "Black Han Sans"',allText),
  document.fonts.load('900 40px "Pretendard"',allText),document.fonts.load('700 40px "Pretendard"',allText)]);

// every glyph the HUD can draw must have its font slice loaded BEFORE frame 0, or canvas silently draws a fallback face
const MISSING=[...new Set(allText)].filter(ch=>ch.trim()&&!/\p{Extended_Pictographic}/u.test(ch)&&!FONT_FAMS.concat([{fam:'Black Han Sans',w:400}]).some(f=>document.fonts.check(`${f.w} 80px "${f.fam}"`,ch)));
console.log('fonts:',FONT_FAMS.map(f=>f.fam).join(' + '),'| glyph slices not loaded:',MISSING.length?MISSING.join(''):'none');

// ---------- optional art assets ----------
const loadImg=u=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=u;});
const AS={bg:await loadImg('./assets/bg-main.jpg')||await loadImg('./assets/bg-main.png'),floor:await loadImg('./assets/arena-floor.png'),
  panel:await loadImg('./assets/panel.png'),rays:await loadImg('./assets/rays.png')};
// per-entry icon pictures: assets/icons/<slug>.png overrides the emoji / painted icon when present
const EXTRA={};
await Promise.all(cfg.entries.filter(e=>e.slug).map(async e=>{const im=await loadImg(`./assets/icons/${e.slug}.png`);if(im){e.icon='#'+e.slug;EXTRA[e.icon]=im;}}));
console.log('icon pictures:',Object.keys(EXTRA).length+'/'+cfg.entries.length);
console.log('assets:',Object.entries(AS).map(([k,v])=>k+(v?'=ok':'=none')).join(' '));

// physics rng (outcome) and cosmetic rng (particles/shake) are separate so visuals never change who wins
// mulberry32 on a hashed seed: consecutive seeds (13,14,15...) must give unrelated games
const mixSeed=x=>{x=Math.imul((x^(x>>>16))>>>0,0x45d9f3b);x=Math.imul((x^(x>>>16))>>>0,0x45d9f3b);return (x^(x>>>16))>>>0;};

const rnd=mb32(mixSeed(SEED+0x9e3779b9)), crnd=mb32(mixSeed(SEED*7919+13));

// ---------- renderer ----------
const glc=document.createElement('canvas');glc.width=RW;glc.height=RH;
const renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(RW,RH,false);
renderer.toneMapping=THREE.NeutralToneMapping;renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05030d);scene.fog=new THREE.FogExp2(0x05030d,0.028);
if(AS.bg){const c=document.createElement('canvas');c.width=RW;c.height=RH;const g=c.getContext('2d');
  const k=Math.max(RW/AS.bg.width,RH/AS.bg.height),w=AS.bg.width*k,h=AS.bg.height*k;g.drawImage(AS.bg,(RW-w)/2,(RH-h)/2,w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;scene.background=t;}
const pmrem=new THREE.PMREMGenerator(renderer);
function studioEnv(){const s=new THREE.Scene();s.background=new THREE.Color(0x06030c);const box=new THREE.BoxGeometry(1,1,1);
  const panel=(c,k,p,sc)=>{const m=new THREE.Mesh(box,new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(k)}));m.position.set(...p);m.scale.set(...sc);s.add(m);};
  panel('#ffffff',7,[0,7,5],[9,0.5,3]);      // top softbox: main specular highlight
  panel('#ff3d9a',4.5,[-8,1,3],[0.5,7,7]);   // pink rim from the left
  panel('#22d3ff',4.5,[8,0,3],[0.5,7,7]);    // cyan rim from the right
  panel('#7b4dff',2.5,[0,-6,4],[11,0.5,5]);  // violet floor bounce
  panel('#ffffff',3.5,[3.5,3,8],[2.2,2.2,0.3]); // small key: catchlight dot
  return pmrem.fromScene(s,0.02).texture;}
scene.environment=studioEnv();
const camera=new THREE.PerspectiveCamera(60,RW/RH,0.1,300);
scene.add(new THREE.AmbientLight(0xffffff,0.25));
const key=new THREE.PointLight(0xb388ff,60,40);key.position.set(0,2,6);scene.add(key);

// ---------- arena ----------
const N=cfg.entries.length, NS=cfg.spikes||10;
const BR=N>12?0.5:0.6, R0=4.6, RMIN=N>12?1.75:1.7, G=13, SHRINK=cfg.shrink||26, SD=30;
const ringMat=new THREE.MeshPhysicalMaterial({color:0xe8e4ff,emissive:0x6a3cff,emissiveIntensity:0.12,metalness:1,roughness:.12,clearcoat:1,clearcoatRoughness:.03});
const ringMesh=new THREE.Mesh(new THREE.TorusGeometry(1,0.06,40,256),ringMat);scene.add(ringMesh);
const neonMat=new THREE.MeshBasicMaterial({color:0x8a5cff,toneMapped:false});
const neon=new THREE.Mesh(new THREE.TorusGeometry(0.938,0.011,12,256),neonMat);neon.position.z=0.02;scene.add(neon);
const halo=new THREE.Mesh(new THREE.TorusGeometry(1,0.09,16,200),new THREE.MeshBasicMaterial({color:0x5a2dff,transparent:true,opacity:.08,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(halo);
const disc=new THREE.Mesh(new THREE.CircleGeometry(1,128),new THREE.MeshPhysicalMaterial({color:0x0a0618,metalness:.85,roughness:.28,clearcoat:1,clearcoatRoughness:.1,transparent:true,opacity:.92}));
disc.position.z=-0.6;scene.add(disc);
if(AS.floor){const t=new THREE.Texture(AS.floor);t.colorSpace=THREE.SRGBColorSpace;t.needsUpdate=true;disc.material.map=t;disc.material.color.set(0xffffff);disc.material.metalness=.25;disc.material.roughness=.45;disc.material.opacity=1;disc.material.needsUpdate=true;}
const spikeGroup=new THREE.Group();scene.add(spikeGroup);
const spikeMat=new THREE.MeshPhysicalMaterial({color:0xff2a4a,emissive:0xff1744,emissiveIntensity:0.5,metalness:.85,roughness:.16,clearcoat:1,clearcoatRoughness:.03,flatShading:true});
for(let i=0;i<NS;i++){const a=(i+0.5)/NS*Math.PI*2;
  const m=new THREE.Mesh(new THREE.ConeGeometry(0.072,0.28,6),spikeMat);
  m.position.set(Math.cos(a)*0.905,Math.sin(a)*0.905,0);m.rotation.z=a+Math.PI/2;spikeGroup.add(m);}
const grid=new THREE.GridHelper(160,80,0x6a3cff,0x24124f);grid.position.y=-7.5;grid.visible=!AS.bg;scene.add(grid);
// warp stars
const SN=1400, starPos=new Float32Array(SN*3);
for(let i=0;i<SN;i++){starPos[i*3]=(crnd()-.5)*70;starPos[i*3+1]=(crnd()-.5)*90;starPos[i*3+2]=-80+crnd()*90;}
const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xcfc4ff,size:0.12,transparent:true,opacity:AS.bg?.2:.8,depthWrite:false}));scene.add(stars);

// ---------- balls ----------
function ballTexture(col){const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');
  x.fillStyle=col;x.fillRect(0,0,256,128);x.fillStyle='rgba(255,255,255,.55)';x.fillRect(0,40,256,14);x.fillRect(0,74,256,14);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
function labelDraw(b){const x=b.lctx;x.clearRect(0,0,256,256);
  for(let h=0;h<3;h++){x.beginPath();x.arc(88+h*40,52,13,0,7);x.fillStyle=h<b.hp?'#fff':'rgba(255,255,255,.18)';x.fill();
    if(h<b.hp&&b.hp===1){x.fillStyle='#ff2d55';x.fill();}}
  let fs=b.name.length>=4?74:b.name.length===3?78:90;x.font=F(DISPLAY,fs);
  while(x.measureText(b.name).width>228)x.font=F(DISPLAY,--fs);
  x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.lineWidth=12;x.strokeStyle='rgba(0,0,0,.85)';
  x.strokeText(b.name,128,148);x.fillStyle='#fff';x.fillText(b.name,128,148);b.ltex.needsUpdate=true;}
const sphereGeo=new THREE.SphereGeometry(1,64,40);
const rimMat=c=>new THREE.ShaderMaterial({uniforms:{c:{value:c.clone()},k:{value:1}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.BackSide,
  vertexShader:'varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
  fragmentShader:'uniform vec3 c;uniform float k;varying vec3 vN;varying vec3 vV;void main(){float f=pow(1.-abs(dot(vN,vV)),2.4);gl_FragColor=vec4(c*f*1.5*k,f*k);}'});
const blobC=document.createElement('canvas');blobC.width=blobC.height=128;{const g=blobC.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(0,0,0,.85)');gr.addColorStop(.55,'rgba(0,0,0,.45)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);}
const blobTex=new THREE.CanvasTexture(blobC);const blobGeo=new THREE.PlaneGeometry(1,1);
const balls=cfg.entries.map((e,i)=>{
  const col=new THREE.Color(e.color);
  const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{cIn:{value:col.clone()},uFlash:{value:0},uWarn:{value:0}},
    vertexShader:'varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
    fragmentShader:`uniform vec3 cIn;uniform float uFlash,uWarn;varying vec3 vN;varying vec3 vV;
    void main(){vec3 N=normalize(vN),V=normalize(vV);vec3 c=mix(cIn,cIn/max(max(cIn.r,max(cIn.g,cIn.b)),.01),.5);/* lift dark entrant colours so every bead reads as glass */float nv=clamp(dot(N,V),0.,1.);float rr=sqrt(max(0.,1.-nv*nv));float edge=smoothstep(.5,.97,rr);            /* rim band = outer ~half of the radius*/
      vec3 L=normalize(vec3(-.55,.7,.6));vec3 R=reflect(-L,N);
      float spec=pow(max(dot(R,V),0.),70.)*1.5+pow(max(dot(R,V),0.),9.)*.3;      /* soft white reflection, upper left*/
      float bounce=pow(clamp(-N.y*.8+.2,0.,1.),2.2)*(1.-edge*.4);                  /* faint colour reflection low in the bead*/
      vec3 body=mix(c*.42+vec3(.14),c*.95,edge)*(1.-.18*smoothstep(.9,1.,rr));   /* clear centre, deep colour band, slightly darker lip                                    // clear, pale centre; deep colour at the rim*/
      float rimLine=smoothstep(.9,.975,rr)*(1.-smoothstep(.975,1.,rr));                    /* thin bright outline*/
      float sec=pow(max(dot(reflect(-normalize(vec3(.62,-.58,.5)),N),V),0.),24.)*.6;       /* small reflection, lower right*/
      vec3 irid=.5+.5*cos(6.2831*(rr*.7+vec3(0.,.33,.67)));
      vec3 col=body+c*bounce*.55+vec3(1.)*(spec+sec*.75)+irid*edge*.09+vec3(1.)*rimLine*.5;
      col=mix(col,vec3(1.,.07,.17),uWarn*.55)+vec3(uFlash*.5);
      float a=clamp(mix(.24,.98,edge)+bounce*.16+spec*.4+sec*.3+rimLine*.5+uFlash*.3+uWarn*.15,0.,1.);
      gl_FragColor=vec4(col,a);}`});
  const mesh=new THREE.Mesh(sphereGeo,mat);mesh.scale.setScalar(BR);scene.add(mesh);
  const rim=new THREE.Mesh(sphereGeo,rimMat(col));rim.scale.setScalar(BR*1.1);scene.add(rim);
  const blob=new THREE.Mesh(blobGeo,new THREE.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false,opacity:.9}));blob.scale.setScalar(BR*2.8);scene.add(blob);
  const lc=document.createElement('canvas');lc.width=lc.height=256;
  const ltex=new THREE.CanvasTexture(lc);ltex.colorSpace=THREE.SRGBColorSpace;
  const label=new THREE.Sprite(new THREE.SpriteMaterial({map:ltex,depthTest:false,transparent:true}));
  label.visible=false;
  const a=i/N*Math.PI*2, r=R0*0.62, sa=rnd()*Math.PI*2, sp=7+rnd()*3;
  const b={i,name:e.name,icon:e.icon||'',quip:e.quip||'',color:e.color,col,mesh,blob,rim,mat,label,lctx:lc.getContext('2d'),ltex,
    sq:0,sqa:0,x:Math.cos(a)*r,y:Math.sin(a)*r,vx:Math.cos(sa)*sp,vy:Math.sin(sa)*sp,r:BR,hp:3,alive:true,inv:0,flash:0,roll:0,trail:[]};
  labelDraw(b);return b;});
// trails
const softC=document.createElement('canvas');softC.width=softC.height=128;{const g=softC.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);}
const softTex=new THREE.CanvasTexture(softC);
const auraMesh=new THREE.InstancedMesh(blobGeo,new THREE.MeshBasicMaterial({map:softTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.13}),N);
const tailMesh=new THREE.InstancedMesh(blobGeo,new THREE.MeshBasicMaterial({map:softTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.17}),N);
for(const b of balls){auraMesh.setColorAt(b.i,b.col);tailMesh.setColorAt(b.i,b.col);}
scene.add(auraMesh);scene.add(tailMesh);
// particles
const PN=900, pMesh=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,0),new THREE.MeshBasicMaterial({toneMapped:false}),PN);
pMesh.material.color.setRGB(1.5,1.5,1.5);scene.add(pMesh);
const P=Array.from({length:PN},()=>({life:0,max:1,x:0,y:0,z:0,vx:0,vy:0,vz:0,s:0,rx:0,ry:0}));let pNext=0;
const tmpC=new THREE.Color(), dummy=new THREE.Object3D();
function burst(x,y,color,n,speed,size,life,up=0){for(let k=0;k<n;k++){const p=P[pNext];pNext=(pNext+1)%PN;
  const th=crnd()*Math.PI*2, ph=(crnd()-.5)*Math.PI, v=speed*(0.3+crnd()*0.9);
  Object.assign(p,{x,y,z:0,vx:Math.cos(th)*Math.cos(ph)*v,vy:Math.sin(th)*Math.cos(ph)*v+up,vz:Math.sin(ph)*v,g:up?-9:6,
    life:life*(0.5+crnd()*0.7),s:size*(0.5+crnd()),rx:crnd()*6,ry:crnd()*6});p.max=p.life;
  tmpC.set(color);if(crnd()<0.25)tmpC.set('#ffffff');pMesh.setColorAt(pNext===0?PN-1:pNext-1,tmpC);}
  pMesh.instanceColor.needsUpdate=true;}
burst(0,0,'#000',1,0,0,0); // allocate instanceColor
// shockwaves
const waves=Array.from({length:8},()=>{const m=new THREE.Mesh(new THREE.RingGeometry(0.85,1,96),
  new THREE.MeshBasicMaterial({transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false,side:THREE.DoubleSide}));
  m.visible=false;scene.add(m);return{m,t:1};});let wNext=0;
function wave(x,y,color,k=1){const w=waves[wNext];wNext=(wNext+1)%waves.length;w.t=0;w.k=k;w.m.position.set(x,y,0.1);
  w.m.material.color.set(color).multiplyScalar(1.4);w.m.visible=true;}

// ---------- post ----------
const composer=new EffectComposer(renderer);composer.setPixelRatio(1);composer.setSize(RW,RH);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(RW,RH),0.45,0.25,0.96);composer.addPass(bloom);
const fx=new ShaderPass({uniforms:{tDiffuse:{value:null},uAb:{value:0},uPulse:{value:0},uRed:{value:0},uFlash:{value:0},uTime:{value:0},uZoom:{value:0}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`uniform sampler2D tDiffuse;uniform float uAb,uPulse,uRed,uFlash,uTime,uZoom;varying vec2 vUv;
 float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
 void main(){vec2 c=vUv-.5;vec3 col=vec3(0.);float ab=uAb*.014;
  for(int i=0;i<5;i++){float k=1.-uZoom*.05*float(i)/4.;vec2 uv=.5+c*k;
   col.r+=texture2D(tDiffuse,.5+(uv-.5)*(1.+ab)).r;col.g+=texture2D(tDiffuse,uv).g;col.b+=texture2D(tDiffuse,.5+(uv-.5)*(1.-ab)).b;}
  col/=5.;float v=smoothstep(.3,.95,length(c*vec2(1.25,1.))*1.3);
  col*=1.-v*(.45+uPulse*.45);col+=vec3(.22,0.,.03)*v*uRed*(.45+uPulse*.8);
  col+=uFlash;col+=(h(vUv*vec2(720.,1280.)+fract(uTime))-.5)*.018;gl_FragColor=vec4(col,1.);}`});
composer.addPass(fx);composer.addPass(new OutputPass());

// ---------- HUD ----------
const out=document.getElementById('out'), o=out.getContext('2d');
const ICONS=Object.assign(buildIcons(cfg.entries.map(e=>e.icon||'').filter(i=>i[0]==='@').map(i=>i.slice(1))),EXTRA);
const NUMRUN=/[0-9A-Za-z.\/:!?%+\-]+|[^0-9A-Za-z.\/:!?%+\-]+/g, ISNUM=/^[0-9A-Za-z.\/:!?%+\-]/;
function runFont(seg,size){const num=FONT_FAMS[0],ko=FONT_FAMS[FONT_FAMS.length-1],f=ISNUM.test(seg)?num:ko;return `${f.w} ${size}px "${f.fam}","Black Han Sans","Pretendard",sans-serif`;}
function runs(s,size){return (String(s).match(NUMRUN)||[]).map(seg=>{o.font=runFont(seg,size);return{seg,font:o.font,w:o.measureText(seg).width};});}
function textW(s,size){return runs(s,size).reduce((a,r)=>a+r.w,0);}
function txt(s,x,y,size,color,font=DISPLAY,align='center',stroke=10,alpha=1){o.save();o.globalAlpha=alpha;
  o.textBaseline='middle';o.lineJoin='round';o.lineWidth=stroke;o.strokeStyle='rgba(0,0,0,.9)';o.fillStyle=color;
  if(font===DISPLAY&&FONT_FAMS.length>1){const rs=runs(s,size),tot=rs.reduce((a,r)=>a+r.w,0);let px=align==='center'?x-tot/2:align==='right'?x-tot:x;
    o.textAlign='left';for(const r of rs){o.font=r.font;if(stroke)o.strokeText(r.seg,px,y);o.fillText(r.seg,px,y);px+=r.w;}}
  else{o.font=F(font,size);o.textAlign=align;if(stroke)o.strokeText(s,x,y);o.fillText(s,x,y);}
  o.restore();}

// ---------- simulation state ----------
const INTRO=2.4;
// Physics runs on a FIXED step in simulation time. Slow-motion only changes how much simulation time
// each video frame consumes, so the outcome for a seed never depends on presentation choices.
const PHYS_VER='p5-fixedstep-120hz-start062', DTF=FDT/4; let simAcc=0;
let f=0,tv=0,simT=0,ring=R0,spin=0,spinV=0.6,ts=1,slowUntil=-1,slowScale=1,trauma=0,flash=0,started=false;
let winner=null,winT=0,finalT=-1,banner=null,beatPhase=0,beatIdx=0,beatPulse=0,hPhase=0,hPulse=0,sub=0;

      const sw=(wt-0.9)/0.9;if(sw>0&&sw<1){o.save();o.strokeStyle=`rgba(255,214,90,${(1-sw)*0.8})`;o.lineWidth=14*(1-sw)+2;o.beginPath();o.arc(cx,cy,250*(1+sw*1.8),0,7);o.stroke();o.restore();}

      beadBody(cx,cy,R,vis(winner.color));

      txt('생존 1위',cx,cy-R-215,72,'#ffffff',DISPLAY,'center',12,k);
      o.save();o.shadowColor=winner.color;o.shadowBlur=50;txt(winner.name,cx,cy+R+115,winner.name.length>3?150:180,'#ffd23f',DISPLAY,'center',16,k);o.restore();
      const kp=Math.min(1,Math.max(0,(wt-2.7)/0.5)),py=cy+R+275,r2=dead.find(d=>d.rank===2),r3=dead.find(d=>d.rank===3);   // 2nd/3rd arrive after the result has had time to land
      if(kp>0){[[r2,'🥈','#dfe6ee',OW/2-250],[r3,'🥉','#e8955a',OW/2+250]].forEach(([d,m,col,px2])=>{if(!d)return;
        o.save();o.globalAlpha=kp;o.translate(px2,py);o.beginPath();o.roundRect(-215,-52,430,104,52);o.fillStyle='rgba(20,12,44,.8)';o.fill();o.lineWidth=4;o.strokeStyle=col;o.shadowColor=col;o.shadowBlur=18;o.stroke();o.restore();
        emo(m,px2-160,py,66,kp);if(d.icon)ico(d.icon,px2-82,py,66,kp);txt(d.name,px2+(d.icon?-28:-80),py,46,vis(d.color),DISPLAY,'left',9,kp);});
        txt(cfg.cta,OW/2,py+150,58,'#ffe14d',DISPLAY,'center',12,kp);}}}
  frames.push({t:+tv.toFixed(4),ts:+ts.toFixed(3),alive:A});

function vis(c){const k=new THREE.Color(c),l=0.2126*k.r+0.7152*k.g+0.0722*k.b;if(l>0.28)return c;const t=Math.min(0.75,(0.28-l)/0.28*0.9);return '#'+k.lerp(new THREE.Color('#ffffff'),t).getHexString();}
function panel9(x,y,w,h,red){const im=AS.panel,c=Math.min(Math.round(im.height*0.42),Math.floor(h/2),Math.floor(w/2)),ic=Math.round(im.height*0.42),
  xs=[0,ic,im.width-ic,im.width],ys=[0,ic,im.height-ic,im.height],dx=[x,x+c,x+w-c,x+w],dy=[y,y+c,y+h-c,y+h];

  for(let i=0;i<3;i++)for(let j=0;j<3;j++)o.drawImage(im,xs[i],ys[j],xs[i+1]-xs[i],ys[j+1]-ys[j],dx[i],dy[j],dx[i+1]-dx[i],dy[j+1]-dy[j]);o.restore();}
const hex2=(c,a)=>{const n=parseInt(c.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};
const CF=Array.from({length:170},()=>({x:crnd(),sp:.55+crnd()*.9,ph:crnd(),sw:crnd()*6,sz:14+crnd()*16,rot:crnd()*6.28,rs:(crnd()-.5)*10,c:['#ffd23f','#ffffff','#ff4d9a','#4cc9f0','#b8ff6a'][(crnd()*5)|0]}));
function beadBody(cx,cy,r,col){o.save();
  const fy=cy+r*1.12,fg=o.createRadialGradient(cx,fy,0,cx,fy,r*1.1);fg.addColorStop(0,hex2(col,.45));fg.addColorStop(1,hex2(col,0));   // colour pooling on the floor
  o.save();o.translate(cx,fy);o.scale(1,.22);o.translate(-cx,-fy);o.fillStyle=fg;o.beginPath();o.arc(cx,fy,r*1.1,0,7);o.fill();o.restore();
  const g=o.createRadialGradient(cx,cy,r*.05,cx,cy,r);g.addColorStop(0,'rgba(255,255,255,.12)');g.addColorStop(.52,hex2(col,.16));g.addColorStop(.78,hex2(col,.55));g.addColorStop(.96,hex2(col,.96));g.addColorStop(1,hex2(col,.7));
  o.fillStyle=g;o.beginPath();o.arc(cx,cy,r,0,7);o.fill();o.restore();}
function beadGlass(cx,cy,r,col){o.save();o.beginPath();o.arc(cx,cy,r*.99,0,7);o.clip();
  o.lineCap='round';o.lineWidth=Math.max(2,r*.028);o.strokeStyle='rgba(255,255,255,.55)';o.beginPath();o.arc(cx,cy,r*.965,0,7);o.stroke();
  o.strokeStyle='rgba(255,255,255,.62)';o.lineWidth=r*.085;o.beginPath();o.arc(cx,cy,r*.8,Math.PI*1.08,Math.PI*1.42);o.stroke();
  o.fillStyle='rgba(255,255,255,.9)';o.beginPath();o.ellipse(cx-r*.5,cy-r*.5,r*.11,r*.07,-.75,0,7);o.fill();
  o.fillStyle='rgba(255,255,255,.5)';o.beginPath();o.ellipse(cx+r*.52,cy+r*.56,r*.15,r*.065,.8,0,7);o.fill();
  o.restore();}
function glass(x,y,w,h,r,edge,a=0.72){if(AS.panel){panel9(x,y,w,h,edge==='#ff3355');return;}o.save();o.beginPath();o.roundRect(x,y,w,h,r);
  const g=o.createLinearGradient(x,y,x,y+h);g.addColorStop(0,`rgba(28,20,52,${a})`);g.addColorStop(1,`rgba(10,6,24,${a})`);o.fillStyle=g;o.fill();
  o.lineWidth=2.5;o.strokeStyle=edge;o.globalAlpha*=0.85;o.shadowColor=edge;o.shadowBlur=18;o.stroke();o.restore();}
function brackets(col,a){const L=110,m=26,w=7;o.save();o.globalAlpha=a;o.strokeStyle=col;o.lineWidth=w;o.lineCap='round';o.shadowColor=col;o.shadowBlur=16;
  for(const [sx,sy] of [[1,1],[-1,1],[1,-1],[-1,-1]]){const x=sx>0?m:OW-m,y=sy>0?m:OH-m;o.beginPath();o.moveTo(x,y+sy*L);o.lineTo(x,y);o.lineTo(x+sx*L,y);o.stroke();}o.restore();}
function ico(ch,x,y,size,alpha=1){if(ICONS[ch]){o.save();o.globalAlpha=alpha;o.shadowColor='rgba(0,0,0,.55)';o.shadowBlur=size*0.15;o.shadowOffsetY=size*0.05;
  o.drawImage(ICONS[ch],x-size*0.68,y-size*0.68,size*1.36,size*1.36);o.restore();}else emo(ch,x,y,size,alpha);}
function emo(ch,x,y,size,alpha=1){o.save();o.globalAlpha=alpha;o.font=`${size|0}px "Noto Color Emoji"`;o.textAlign='center';o.textBaseline='middle';o.fillStyle='#ffffff';
  o.shadowColor='rgba(0,0,0,.55)';o.shadowBlur=size*0.18;o.shadowOffsetY=size*0.06;o.fillText(ch,x,y);o.restore();}
function strip(a){o.save();o.globalAlpha=a*0.62;o.fillStyle='#05030d';o.beginPath();o.roundRect(40,1345,OW-80,185,28);o.fill();o.restore();}
function drawDie(bn,age){if(age>1.6)return;const a=age>1.3?(1.6-age)/0.3:1,pop=age<0.12?1.22-age/0.12*0.22:1,

window.__hudTest=cases=>cases.map(c=>{let worst=1e9;for(let age=0;age<=1.55;age+=0.01){
