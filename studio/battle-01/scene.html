<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ===== Birth-month battle royale: 12 balls, shrinking ring, spikes, last one alive wins =====
const W=1080,H=1920,FPS=60,DT=1/FPS;
const ctx=document.getElementById('c').getContext('2d');
let seed=20261010; const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
const NAMES=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const COLS=['#ff4d6d','#ff9f1c','#ffe066','#8ac926','#2ec4b6','#4cc9f0','#4361ee','#7b2cbf','#f72585','#b5e48c','#ff7b00','#e0aaff'];
const CX=W/2,CY=H/2+60,R0=470,RMIN=150,BR=46;
const balls=NAMES.map((n,i)=>{const a=i/12*Math.PI*2,r=R0*0.6;
 return{n,c:COLS[i],x:CX+Math.cos(a)*r,y:CY+Math.sin(a)*r,vx:(rnd()-.5)*700,vy:(rnd()-.5)*700,alive:true,hp:3,flash:0};});
const SPIKES=10; let ring=R0, t=0, dead=[], winner=null, winT=0;
window.events=[]; // {t,type} for audio sync
function step(){
 t+=DT; if(winner)return; ring=Math.max(RMIN,R0-(R0-RMIN)*Math.min(1,t/34)); const spin=t*0.9;
 const live=balls.filter(b=>b.alive);
 for(const b of live){b.vy+=900*DT;b.x+=b.vx*DT;b.y+=b.vy*DT;b.flash*=0.85;
  // ring collision
  const dx=b.x-CX,dy=b.y-CY,d=Math.hypot(dx,dy);
  if(d+BR>ring){const nx=dx/d,ny=dy/d;b.x=CX+nx*(ring-BR);b.y=CY+ny*(ring-BR);
   const vn=b.vx*nx+b.vy*ny; b.vx-=2*vn*nx*0.98; b.vy-=2*vn*ny*0.98;
   b.vx+=ny*60; b.vy-=nx*60; // ring spin pushes tangentially
   // spike check
   const ang=Math.atan2(ny,nx)-spin; const k=((ang/(Math.PI*2)*SPIKES)%1+1)%1;
   if(Math.abs(k-0.5)<0.045){b.hp--;b.flash=1;window.events.push({t,type:'hit'});
    if(b.hp<=0){b.alive=false;dead.push({n:b.n,c:b.c,t});window.events.push({t,type:'die'});}}
   else window.events.push({t,type:'bounce',v:Math.abs(vn)});
  }}
 // ball-ball elastic
 for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){const a=live[i],b=live[j];
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;if(d<BR*2){const nx=dx/d,ny=dy/d,ov=(BR*2-d)/2;
   a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
   if(rv<0){a.vx+=rv*nx;a.vy+=rv*ny;b.vx-=rv*nx;b.vy-=rv*ny;if(-rv>250)window.events.push({t,type:'clack'});}}}
 const al=balls.filter(b=>b.alive);
 if(al.length===1&&!winner){winner=al[0];winT=t;window.events.push({t,type:'win'});}
}
function draw(){
 ctx.fillStyle='#0b0b14';ctx.fillRect(0,0,W,H);
 // title
 ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 72px sans-serif';
 ctx.fillText('당신의 생일 달은',W/2,200);ctx.fillText('몇 초 살아남을까?',W/2,290);
 ctx.font='40px sans-serif';ctx.fillStyle='#9aa';ctx.fillText('⏱ '+t.toFixed(1)+'s   남은 달 '+balls.filter(b=>b.alive).length+'/12',W/2,360);
 // ring + spikes
 const spin=t*0.9;ctx.save();ctx.translate(CX,CY);
 ctx.strokeStyle='#2a2a40';ctx.lineWidth=18;ctx.beginPath();ctx.arc(0,0,ring,0,7);ctx.stroke();
 for(let i=0;i<SPIKES;i++){const a=(i+0.5)/SPIKES*Math.PI*2+spin;ctx.save();ctx.rotate(a);
  ctx.fillStyle='#ff2d55';ctx.beginPath();ctx.moveTo(ring+6,-28);ctx.lineTo(ring-48,0);ctx.lineTo(ring+6,28);ctx.fill();ctx.restore();}
 ctx.restore();
 for(const b of balls){if(!b.alive)continue;
  ctx.save();ctx.shadowColor=b.c;ctx.shadowBlur=b.flash>0.1?60:22;
  ctx.fillStyle=b.flash>0.3?'#fff':b.c;ctx.beginPath();ctx.arc(b.x,b.y,BR,0,7);ctx.fill();ctx.restore();
  ctx.fillStyle='#000';ctx.font='bold 34px sans-serif';ctx.fillText(b.n,b.x,b.y+12);
  for(let h=0;h<3;h++){ctx.fillStyle=h<b.hp?'#fff':'#444';ctx.beginPath();ctx.arc(b.x-22+h*22,b.y-BR-18,7,0,7);ctx.fill();}}
 // elimination list
 ctx.textAlign='left';ctx.font='36px sans-serif';
 dead.slice(-6).forEach((d,i)=>{ctx.fillStyle=d.c;ctx.fillText('✖ '+d.n+'  '+d.t.toFixed(1)+'s',60,1560+i*50);});
 if(winner){const k=Math.min(1,(t-winT)*2);ctx.save();ctx.globalAlpha=k;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.fillStyle=winner.c;ctx.font='bold 150px sans-serif';ctx.fillText(winner.n,W/2,H/2-40);
  ctx.fillStyle='#fff';ctx.font='bold 80px sans-serif';ctx.fillText('생존 1위 🏆',W/2,H/2+90);
  ctx.font='48px sans-serif';ctx.fillStyle='#ccc';ctx.fillText('네 달은 몇 등? 댓글로 👇',W/2,H/2+200);ctx.restore();}
}
window.frame=function(){for(let s=0;s<2;s++){if(winner)t+=DT;else step();}draw();return{done:winner&&t-winT>3.5,t};}; // 2 substeps
window.ready=true;
</script>
