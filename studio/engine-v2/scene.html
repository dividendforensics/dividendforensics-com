<script type="module">
// Miniature-tray look. Beads rest on a shallow round tray seen from a high fixed angle; one key light

// ---------- config ----------

const FONT_SLUGS=(qs.get('fonts')||(cfg.fonts||['black-han-sans']).join(',')).split(',').filter(Boolean);
const FONT_FAMS=[];

  if(!r.ok)continue;const t=await r.text();const m=t.match(/font-family:\s*['"]?([^;'"]+)['"]?;/);

  FONT_FAMS.push({fam:m[1].trim(),w:w==='index'?400:+w});break;}}
const DISPLAY=`%spx ${FONT_FAMS.map(f=>`"${f.fam}"`).join(',')},"Black Han Sans","Pretendard",sans-serif`, B9='900 %spx "Pretendard",sans-serif', B7='700 %spx "Pretendard",sans-serif';
const F=(font,size)=>font.replace('%s',size);
const allText=[...cfg.title,cfg.pick,cfg.cta,...cfg.entries.map(e=>e.name+(e.quip||'')),
  '0123456789위탈락최후의개누가살아남을까생존남은GO!초·/…결투단판HP . : ? % + - K.O 🏆👇🥈🥉👑 아슬'].join('');
await Promise.all([...FONT_FAMS.map(f=>document.fonts.load(`${f.w} 80px "${f.fam}"`,allText)),document.fonts.load('80px "Black Han Sans"',allText),
  document.fonts.load('900 40px "Pretendard"',allText),document.fonts.load('700 40px "Pretendard"',allText)]);

// ---------- art ----------
const loadImg=u=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=u;});
const BGQ=qs.get('bg')||cfg.bg||'navy';

const EXTRA={};
await Promise.all(cfg.entries.filter(e=>e.slug).map(async e=>{const im=await loadImg(`./assets/icons/${e.slug}.png`);if(im){e.icon='#'+e.slug;EXTRA[e.icon]=im;}}));
console.log('icon pictures:',Object.keys(EXTRA).length+'/'+cfg.entries.length);

const ICONS=Object.assign(buildIcons(cfg.entries.map(e=>e.icon||'').filter(i=>i[0]==='@').map(i=>i.slice(1))),EXTRA);

// ---------- simulation (done before any frame) ----------
const N=cfg.entries.length;
const REC=simulate({n:N,seed:SEED,spikes:cfg.spikes,shrink:cfg.shrink,...SC.sim});
const TL=timeline(REC,{noslow:!!qs.get('noslow'),outro:SC.sim.maxT?0:5.8}), RP=replayer(REC);
const BR=REC.BR, R0=REC.R0, NS=REC.NS;
const crnd=mb32(mixSeed(SEED*7919+13));   // cosmetic only (particles, confetti)

// ---------- renderer ----------
const glc=document.createElement('canvas');glc.width=RW;glc.height=RH;
const renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(RW,RH,false);
renderer.toneMapping=THREE.NeutralToneMapping;renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene();
const W=(x,y,h=0)=>new THREE.Vector3(x,h,-y);   // physics plane (x,y) -> tray floor (x, h, -y); +y in physics = away from camera
const LDIR=new THREE.Vector3(-0.55,1.0,-0.6).normalize();   // toward the key light: left, up, behind the tray

// background (?bg=): navy = dark gradient behind the tray | stage = tray stands on a dark floor under a spotlight
//   cream = tray on a light warm table (product-shot) | bokeh = navy with soft out-of-focus lights
const BG=qs.get('bg')||cfg.bg||'navy';
const BGS={navy:{vig:.55},bokeh:{vig:.5},gpt:{vig:.4},gptfloor:{vig:.4},nebula:{vig:.25},
  stage:{vig:.45,ground:['#4a3d7a','#251e45','#0d0b1c'],sky:'#0d0b1c'},
  cream:{vig:.12,ground:['#fff7ea','#efe2cc','#c9b79b'],sky:'#c9b79b'}}, BGC=BGS[BG]||BGS.navy;
if(BG==='bokeh'||BG==='navy'||BG==='nebula'||BG.startsWith('gpt')){const c=document.createElement('canvas');c.width=RW;c.height=RH;const g=c.getContext('2d');
  const lg=g.createLinearGradient(0,0,0,RH);lg.addColorStop(0,'#141030');lg.addColorStop(.45,'#0e0b24');lg.addColorStop(1,'#060510');g.fillStyle=lg;g.fillRect(0,0,RW,RH);
  if(AS.bg&&BG==='nebula'){const k=Math.max(RW/AS.bg.width,RH/AS.bg.height);g.drawImage(AS.bg,(RW-AS.bg.width*k)/2,(RH-AS.bg.height*k)/2,AS.bg.width*k,AS.bg.height*k);}   /* user-supplied calm nebula (dark centre), used as is */
  else if(AS.bg&&BG.startsWith('gpt')){const k=Math.max(RW/AS.bg.width,RH/AS.bg.height);g.drawImage(AS.bg,(RW-AS.bg.width*k)/2,(RH-AS.bg.height*k)/2,AS.bg.width*k,AS.bg.height*k);   /* GPT background art, full strength */
    g.fillStyle='rgba(6,4,16,.25)';g.fillRect(0,0,RW,RH);}
  else if(AS.bg){g.globalAlpha=.10;g.filter='blur(6px) saturate(.6)';const k=Math.max(RW/AS.bg.width,RH/AS.bg.height);g.drawImage(AS.bg,(RW-AS.bg.width*k)/2,(RH-AS.bg.height*k)/2,AS.bg.width*k,AS.bg.height*k);g.filter='none';g.globalAlpha=1;}
  const rg=g.createRadialGradient(RW/2,RH*0.43,0,RW/2,RH*0.43,RW*0.75);rg.addColorStop(0,'rgba(80,64,160,.20)');rg.addColorStop(1,'rgba(80,64,160,0)');g.fillStyle=rg;g.fillRect(0,0,RW,RH);
  if(BG==='bokeh'){const br=mb32(77);g.filter=`blur(${RW*0.012}px)`;for(let k=0;k<34;k++){const x=br()*RW,y=br()<0.5?br()*RH*0.28:RH*(0.72+br()*0.28),r=RW*(0.03+br()*0.07);
    g.fillStyle=['rgba(255,190,90,','rgba(255,110,160,','rgba(110,210,255,','rgba(190,150,255,'][k%4]+(0.12+br()*0.22)+')';g.beginPath();g.arc(x,y,r,0,7);g.fill();}g.filter='none';}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;scene.background=t;}

// environment for reflections: one large soft key box in the same direction as the key light
const pmrem=new THREE.PMREMGenerator(renderer);
{const s=new THREE.Scene();s.background=new THREE.Color(0x0b0918);const box=new THREE.BoxGeometry(1,1,1);
  const panel=(c,k,p,sc,geo=box)=>{const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(k)}));m.position.copy(p);m.scale.set(...sc);m.lookAt(0,0,0);s.add(m);};
  panel('#fff6ec',5.0,LDIR.clone().multiplyScalar(7),[2.6,2.0,0.2],new THREE.SphereGeometry(1,24,16));   // key: round soft box, so the highlight is an oval, not a window
  panel('#9fb0ff',0.9,new THREE.Vector3(6,2.5,4),[3,4,0.2]);                          // cool fill, front right
  panel('#ffffff',1.2,new THREE.Vector3(0,9,0),[6,0.2,6]);                            // ceiling
  panel('#2a2050',1.0,new THREE.Vector3(0,-3,0),[14,0.2,14]);                         // dim floor bounce
  scene.environment=pmrem.fromScene(s,0.03).texture;}
const key=new THREE.DirectionalLight(0xfff2e4,2.3);key.position.copy(LDIR).multiplyScalar(30);scene.add(key);
scene.add(new THREE.HemisphereLight(0xbdb6ff,0x1a1430,0.6));

// ---------- tray ----------
function softTex0(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),rg=g.createRadialGradient(64,64,0,64,64,64);rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(.7,'rgba(255,255,255,.6)');rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
function canvasTex(size,draw){const c=document.createElement('canvas');c.width=c.height=size;draw(c.getContext('2d'),size);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;}
const floorTex=canvasTex(1024,(g,S)=>{const rg=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);rg.addColorStop(0,'#2e2858');rg.addColorStop(.75,'#221d46');rg.addColorStop(1,'#181433');
  g.fillStyle=rg;g.fillRect(0,0,S,S);g.strokeStyle='rgba(255,255,255,.035)';g.lineWidth=2;for(let r=60;r<S/2;r+=64){g.beginPath();g.arc(S/2,S/2,r,0,7);g.stroke();}
  for(let i=0;i<9000;i++){g.fillStyle=`rgba(255,255,255,${crnd()*0.03})`;g.fillRect(crnd()*S,crnd()*S,2,2);}});
const TR=R0+0.85;
if(BG==='gptfloor'&&AS.floor){floorTex.image=AS.floor;floorTex.needsUpdate=true;}   // GPT arena floor art on the tray
const floor=new THREE.Mesh(new THREE.CircleGeometry(TR,128),new THREE.MeshStandardMaterial({map:floorTex,roughness:.62,metalness:0,envMapIntensity:.35}));
floor.rotation.x=-Math.PI/2;scene.add(floor);
if(BGC.ground){const gt=canvasTex(1024,(g,S)=>{const rg=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);rg.addColorStop(0,BGC.ground[0]);rg.addColorStop(.16,BGC.ground[1]);rg.addColorStop(.6,BGC.ground[2]);rg.addColorStop(1,BGC.ground[2]);g.fillStyle=rg;g.fillRect(0,0,S,S);});
  const ground=new THREE.Mesh(new THREE.CircleGeometry(60,96),new THREE.MeshStandardMaterial({map:gt,roughness:.75,metalness:0,envMapIntensity:.2,color:BG==='cream'?0xb8b0a6:0xffffff}));
  ground.rotation.x=-Math.PI/2;ground.position.y=-0.5;scene.add(ground);scene.background=new THREE.Color(BGC.sky);
  const ps=new THREE.Mesh(new THREE.CircleGeometry(1,64),new THREE.MeshBasicMaterial({map:softTex0(),color:0x000000,transparent:true,opacity:BG==='cream'?.32:.6,depthWrite:false}));   // plinth's soft shadow on the ground
  ps.rotation.x=-Math.PI/2;ps.position.set(0.9,-0.495,0.9);ps.scale.setScalar(R0+2.2);scene.add(ps);}
const plinth=new THREE.Mesh(new THREE.CylinderGeometry(TR+0.2,TR+0.32,0.5,128),new THREE.MeshPhysicalMaterial({color:0x15112c,roughness:.45,metalness:.3,clearcoat:.4}));
plinth.position.y=-0.252;scene.add(plinth);
const lip=new THREE.Mesh(new THREE.TorusGeometry(TR+0.04,0.17,24,200),new THREE.MeshPhysicalMaterial({color:0x3b3374,roughness:.3,metalness:.45,clearcoat:.8,clearcoatRoughness:.15}));
lip.rotation.x=-Math.PI/2;lip.position.y=0.05;scene.add(lip);
// shrinking fence = the physics ring: low smoky band + polished rail, spikes point inward at bead height
const railMat=new THREE.MeshPhysicalMaterial({color:0xe2ddff,metalness:.9,roughness:.2,clearcoat:1,clearcoatRoughness:.05,emissive:0x5a3cff,emissiveIntensity:.06});
const bandMat=new THREE.MeshPhysicalMaterial({color:0x8a7fd6,roughness:.25,metalness:.1,transparent:true,opacity:.2,side:THREE.DoubleSide,depthWrite:false});
const outMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.42,depthWrite:false});
let rail=null,band=null,outside=null,builtR=-1;
function buildFence(r){if(Math.abs(r-builtR)<0.003)return;builtR=r;
  for(const m of [rail,band,outside])if(m){scene.remove(m);m.geometry.dispose();}
  rail=new THREE.Mesh(new THREE.TorusGeometry(r+0.07,0.075,16,180),railMat);rail.rotation.x=-Math.PI/2;rail.position.y=0.44;scene.add(rail);
  band=new THREE.Mesh(new THREE.CylinderGeometry(r+0.06,r+0.06,0.44,180,1,true),bandMat);band.position.y=0.22;scene.add(band);
  outside=new THREE.Mesh(new THREE.RingGeometry(r+0.06,TR+0.2,160),outMat);outside.rotation.x=-Math.PI/2;outside.position.y=0.004;scene.add(outside);}
const softTex=canvasTex(128,(g,S)=>{const rg=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(.45,'rgba(255,255,255,.55)');rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.fillRect(0,0,S,S);});
softTex.colorSpace=THREE.NoColorSpace;
// contact shading where the floor meets the fence
const aoTex=canvasTex(512,(g,S)=>{const rg=g.createRadialGradient(S/2,S/2,S*0.36,S/2,S/2,S/2);rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(.85,'rgba(0,0,0,.35)');rg.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=rg;g.beginPath();g.arc(S/2,S/2,S/2,0,7);g.fill();});
const ao=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.MeshBasicMaterial({map:aoTex,transparent:true,depthWrite:false}));ao.rotation.x=-Math.PI/2;ao.position.y=0.003;scene.add(ao);
const spikeMat=new THREE.MeshPhysicalMaterial({color:0xff3d58,metalness:.35,roughness:.3,clearcoat:.8,clearcoatRoughness:.1,emissive:0xff1f3d,emissiveIntensity:.22});
const spikes=[];for(let i=0;i<NS;i++){const m=new THREE.Mesh(new THREE.ConeGeometry(0.13,0.46,24),spikeMat);scene.add(m);spikes.push(m);}
const UPY=new THREE.Vector3(0,1,0);

// ---------- beads ----------
const sphereGeo=new THREE.SphereGeometry(1,72,48), planeGeo=new THREE.PlaneGeometry(1,1);
const col3=c=>new THREE.Color(c);
const lift=(c,k)=>col3(c).lerp(new THREE.Color('#ffffff'),k);
function iconCanvas(e){const c=document.createElement('canvas');c.width=c.height=384;const g=c.getContext('2d');const im=ICONS[e.icon];
  if(im)g.drawImage(im,0,0,384,384);else{g.font='260px "Noto Color Emoji"';g.textAlign='center';g.textBaseline='middle';g.fillText(e.icon||'',192,200);}return c;}
const shellVS='varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}';
// glass shell over the transmissive body: colour gathers toward the silhouette, deeper on the side away
// from the key light; one wide soft highlight + one small hot spot from the same light
const shellFS=`uniform vec3 cDeep,cLite,Lv;uniform float uWarn,uFlash;varying vec3 vN;varying vec3 vV;
void main(){vec3 N=normalize(vN),V=normalize(vV);float nv=clamp(dot(N,V),0.,1.);
  float lit=clamp(dot(N,Lv)*.5+.5,0.,1.);
  float e=smoothstep(.0,.9,1.-nv);e=e*e*(1.35-.65*lit);

  vec3 ec=mix(cDeep*.75,cLite,lit*.55);

  gl_FragColor=vec4(c,a);}`;
const shadowMat=k=>new THREE.MeshBasicMaterial({map:softTex,color:0x000000,transparent:true,opacity:k,depthWrite:false});
const balls=cfg.entries.map((e,i)=>{
  const [x,y]=sample(REC,i,0), col=e.color;
  const b={i,name:e.name,icon:e.icon||'',quip:e.quip||'',color:col,x,y,r:BR,hp:3,alive:true,flash:0,warn:0,dieT:-1};
  // floor: tight contact shadow, soft cast shadow away from the light, coloured caustic inside it
  b.contact=new THREE.Mesh(planeGeo,shadowMat(.72));b.contact.rotation.x=-Math.PI/2;scene.add(b.contact);
  b.cast=new THREE.Mesh(planeGeo,shadowMat(.5));b.cast.rotation.x=-Math.PI/2;scene.add(b.cast);
  b.caustic=new THREE.Mesh(planeGeo,new THREE.MeshBasicMaterial({map:softTex,color:lift(col,.35),transparent:true,opacity:.42,blending:THREE.AdditiveBlending,depthWrite:false}));
  b.caustic.rotation.x=-Math.PI/2;scene.add(b.caustic);
  if(LOOK==='v3d'){
    // low ior + thin: the food stays the right size and colour behind the glass (strong refraction zoomed and dyed it)
    b.body=new THREE.Mesh(sphereGeo,new THREE.MeshPhysicalMaterial({color:lift(col,.7),transmission:1,thickness:.6,ior:1.06,roughness:.03,metalness:0,
      clearcoat:1,clearcoatRoughness:.16,attenuationColor:lift(col,.1),attenuationDistance:3.5,specularIntensity:.35,envMapIntensity:1.0}));
    b.shell=new THREE.Mesh(sphereGeo,new THREE.ShaderMaterial({transparent:true,depthWrite:false,vertexShader:shellVS,fragmentShader:shellFS,
      uniforms:{cDeep:{value:col3(col)},cLite:{value:lift(col,.5)},Lv:{value:new THREE.Vector3()},uWarn:{value:0},uFlash:{value:0}}}));
    const it=new THREE.CanvasTexture(iconCanvas(e));it.colorSpace=THREE.SRGBColorSpace;it.anisotropy=4;
    b.food=new THREE.Mesh(planeGeo,new THREE.MeshBasicMaterial({map:it,alphaTest:.45}));
    scene.add(b.body);scene.add(b.shell);scene.add(b.food);}
  return b;});

// ---------- particles (world space, settle on the floor) ----------
const PN=500, pMesh=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,0),new THREE.MeshStandardMaterial({roughness:.35,metalness:.1,envMapIntensity:.8}),PN);
scene.add(pMesh);const P=Array.from({length:PN},()=>({life:0,max:1,x:0,y:0,z:0,vx:0,vy:0,vz:0,s:0,rx:0,ry:0}));let pNext=0;
const tmpC=new THREE.Color(), dummy=new THREE.Object3D();
function burst(p3,color,n,speed,size,life){for(let k=0;k<n;k++){const p=P[pNext],idx=pNext;pNext=(pNext+1)%PN;
  const th=crnd()*Math.PI*2,v=speed*(0.35+crnd()*0.8),up=0.4+crnd()*0.9;
  Object.assign(p,{x:p3.x,y:p3.y,z:p3.z,vx:Math.cos(th)*v,vz:Math.sin(th)*v,vy:v*up,life:life*(0.6+crnd()*0.6),s:size*(0.5+crnd()),rx:crnd()*6,ry:crnd()*6});p.max=p.life;
  tmpC.set(color);if(crnd()<0.2)tmpC.set('#ffffff');pMesh.setColorAt(idx,tmpC);}pMesh.instanceColor.needsUpdate=true;}
burst(new THREE.Vector3(),'#000',1,0,0,0);
const rings=Array.from({length:6},()=>{const m=new THREE.Mesh(new THREE.RingGeometry(0.86,1,96),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));
  m.rotation.x=-Math.PI/2;m.position.y=0.006;m.visible=false;scene.add(m);return{m,t:1};});let rNext=0;
function floorRing(x,y,color,k=1){const w=rings[rNext];rNext=(rNext+1)%rings.length;w.t=0;w.k=k;w.m.position.x=x;w.m.position.z=-y;w.m.material.color.set(color);w.m.visible=true;}

// ---------- camera: fixed high angle; distance follows the fence so the whole arena stays in frame ----------
const EL=58*Math.PI/180, camera=new THREE.PerspectiveCamera(30,RW/RH,0.1,200);
const ACY=+(qs.get('acy')||840), ARR=500;
function placeCamera(ringR,shake){const Rv=ringR+0.4, hf=Math.atan(Math.tan(camera.fov*Math.PI/360)*camera.aspect), D=Rv*(OW/2)/(ARR*Math.tan(hf));
  camera.position.set(shake.x,Math.sin(EL)*D+shake.y,Math.cos(EL)*D);camera.lookAt(shake.x*0.3,0,0);
  camera.setViewOffset(RW,RH,0,(OH/2-ACY)*RH/OH,RW,RH);camera.updateMatrixWorld();}

// ---------- HUD helpers ----------
const out=document.getElementById('out'), o=out.getContext('2d');
const NUMRUN=/[0-9A-Za-z.\/:!?%+\-]+|[^0-9A-Za-z.\/:!?%+\-]+/g, ISNUM=/^[0-9A-Za-z.\/:!?%+\-]/;
function runFont(seg,size){const num=FONT_FAMS[0],ko=FONT_FAMS[FONT_FAMS.length-1],f=ISNUM.test(seg)?num:ko;return `${f.w} ${size}px "${f.fam}","Black Han Sans","Pretendard",sans-serif`;}
function runs(s,size){return (String(s).match(NUMRUN)||[]).map(seg=>{o.font=runFont(seg,size);return{seg,font:o.font,w:o.measureText(seg).width};});}
function textW(s,size){return runs(s,size).reduce((a,r)=>a+r.w,0);}
function txt(s,x,y,size,color,font=DISPLAY,align='center',stroke=10,alpha=1){o.save();o.globalAlpha*=alpha;
  o.textBaseline='middle';o.lineJoin='round';o.lineWidth=stroke;o.strokeStyle='rgba(0,0,0,.88)';o.fillStyle=color;
  if(font===DISPLAY&&FONT_FAMS.length>1){const rs=runs(s,size),tot=rs.reduce((a,r)=>a+r.w,0);let px=align==='center'?x-tot/2:align==='right'?x-tot:x;
    o.textAlign='left';for(const r of rs){o.font=r.font;if(stroke)o.strokeText(r.seg,px,y);o.fillText(r.seg,px,y);px+=r.w;}}
  else{o.font=F(font,size);o.textAlign=align;if(stroke)o.strokeText(s,x,y);o.fillText(s,x,y);}
  o.restore();}
function vis(c){const k=new THREE.Color(c),l=0.2126*k.r+0.7152*k.g+0.0722*k.b;if(l>0.28)return c;const t=Math.min(0.75,(0.28-l)/0.28*0.9);return '#'+k.lerp(new THREE.Color('#ffffff'),t).getHexString();}
const rgba=(c,a)=>{const k=col3(c);return `rgba(${k.r*255|0},${k.g*255|0},${k.b*255|0},${a})`;};
const mixc=(c,d,t)=>'#'+col3(c).lerp(col3(d),t).getHexString();
function ico(ch,x,y,size,alpha=1,shadow=true){if(ICONS[ch]){o.save();o.globalAlpha*=alpha;if(shadow){o.shadowColor='rgba(0,0,0,.5)';o.shadowBlur=size*0.12;o.shadowOffsetY=size*0.05;}
  o.drawImage(ICONS[ch],x-size*0.68,y-size*0.68,size*1.36,size*1.36);o.restore();}else emo(ch,x,y,size,alpha);}
function emo(ch,x,y,size,alpha=1){o.save();o.globalAlpha*=alpha;o.font=`${size|0}px "Noto Color Emoji"`;o.textAlign='center';o.textBaseline='middle';o.fillStyle='#ffffff';
  o.shadowColor='rgba(0,0,0,.5)';o.shadowBlur=size*0.15;o.shadowOffsetY=size*0.05;o.fillText(ch,x,y);o.restore();}
const toScreen=v=>{const p=v.clone().project(camera);return [(p.x+1)/2*OW,(1-p.y)/2*OH];};
function screenOf(b,cx,cy,h){const c=W(cx,cy,h),[sx,sy]=toScreen(c),right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0),[qx,qy]=toScreen(c.clone().addScaledVector(right,b.r));return [sx,sy,Math.hypot(qx-sx,qy-sy)];}

// painted bead (2.5D): same light as the 3D scene (upper left), body deeper on the lower right,
// food sits inside under the glass; also used for the winner close-up in both looks
function bead25(cx,cy,r,col,icon,sq,warn=0,flash=0){o.save();o.translate(cx,cy);
  if(sq&&Math.abs(sq.s)>1e-3){o.rotate(sq.a);o.scale(1-sq.s,1+sq.s*0.5);o.rotate(-sq.a);}
  const deep=mixc(col,'#000000',.35), lite=mixc(col,'#ffffff',.6);
  let g=o.createRadialGradient(-r*.32,-r*.38,r*.05,0,0,r);g.addColorStop(0,rgba(lite,.34));g.addColorStop(.62,rgba(col,.40));g.addColorStop(1,rgba(deep,.80));
  o.fillStyle=g;o.beginPath();o.arc(0,0,r,0,7);o.fill();
  if(icon){o.save();o.beginPath();o.arc(0,0,r*.93,0,7);o.clip();o.shadowColor='rgba(0,0,0,.45)';o.shadowBlur=r*.12;o.shadowOffsetX=r*.04;o.shadowOffsetY=r*.07;
    if(ICONS[icon])o.drawImage(ICONS[icon],-r*.82,-r*.9,r*1.64,r*1.64);else{o.font=`${r*1.1|0}px "Noto Color Emoji"`;o.textAlign='center';o.textBaseline='middle';o.fillText(icon,0,-r*.06);}o.restore();}
  g=o.createRadialGradient(-r*.12,-r*.15,r*.55,0,0,r*1.02);g.addColorStop(0,rgba(deep,0));g.addColorStop(.72,rgba(col,.22));g.addColorStop(1,rgba(deep,.78));
  o.fillStyle=g;o.beginPath();o.arc(0,0,r,0,7);o.fill();
  o.save();o.globalCompositeOperation='lighter';g=o.createRadialGradient(r*.3,r*.5,0,r*.3,r*.5,r*.45);g.addColorStop(0,rgba(lite,.32));g.addColorStop(1,rgba(lite,0));
  o.fillStyle=g;o.beginPath();o.arc(0,0,r,0,7);o.fill();o.restore();
  o.lineCap='round';o.strokeStyle='rgba(255,255,255,.42)';o.lineWidth=Math.max(1.5,r*.035);o.beginPath();o.arc(0,0,r*.95,Math.PI*1.02,Math.PI*1.58);o.stroke();
  o.save();o.translate(-r*.36,-r*.44);o.rotate(-.6);g=o.createRadialGradient(0,0,0,0,0,r*.5);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');
  o.scale(1,.6);o.fillStyle=g;o.beginPath();o.arc(0,0,r*.5,0,7);o.fill();o.restore();
  o.fillStyle='rgba(255,255,255,.95)';o.beginPath();o.ellipse(-r*.45,-r*.5,r*.1,r*.06,-.7,0,7);o.fill();
  o.strokeStyle='rgba(10,6,24,.35)';o.lineWidth=Math.max(1,r*.025);o.beginPath();o.arc(0,0,r*.995,0,7);o.stroke();
  if(warn>0||flash>0){o.globalCompositeOperation='source-atop';o.fillStyle=warn>0?`rgba(255,40,70,${warn*.35})`:`rgba(255,255,255,${flash*.3})`;o.beginPath();o.arc(0,0,r,0,7);o.fill();}
  o.restore();}

// ---------- replay ----------
let f=0,tv=0,simT=0,ring=R0,spin=0,ts=1,trauma=0,flash=0,started=false;
let winner=null,winT=0,banner=null,beatPhase=0,beatIdx=0,beatPulse=0,hPhase=0,hPulse=0,duel=false,nearPop=null;
const dead=[],events=[],frames=[];
const alive=()=>balls.filter(b=>b.alive);
const evA=(t,type,o={})=>events.push({t:+t.toFixed(4),type,...o});
const H={
  hit(e,t){const b=balls[e.i];b.hp=e.hp;b.flash=1;burst(W(b.x+e.nx*b.r,b.y+e.ny*b.r,0.45),'#ff4060',10,2.6,0.05,0.5);evA(t,'hit',{i:b.i,x:b.x/R0});},
  die(e,t){const b=balls[e.i];b.alive=false;b.dieT=t;dead.push({name:b.name,icon:b.icon,color:b.color,rank:e.rank,t:e.t});
    burst(W(b.x,b.y,b.r),b.color,34,4.2,0.07,1.1);floorRing(b.x,b.y,b.color,1.6);trauma=Math.max(trauma,0.18);
    for(const m of [b.contact,b.cast,b.caustic,b.body,b.shell,b.food])if(m)m.visible=false;
    evA(t,'die',{i:b.i,x:b.x/R0,rank:e.rank});banner={kind:'die',name:b.name,icon:b.icon,quip:b.quip,color:b.color,rank:e.rank,t};},
  final(e,t){evA(t,'final');banner={kind:'final',t:t+0.9,pre:banner};duel=true;for(const a of alive())a.hp=2;},
  win(e,t){winner=balls[e.i];winT=t;trauma=0.4;evA(t,'win',{i:e.i});},
  bounce(e,t){const b=balls[e.i];evA(t,'bounce',{i:b.i,v:e.v,x:b.x/R0});},
  near(e,t){const b=balls[e.i];evA(t,'near',{i:b.i,x:b.x/R0});if(TL.near.has(e))nearPop={b,t};},
  clack(e,t){const a=balls[e.i],b=balls[e.j];evA(t,'clack',{x:(a.x+b.x)/2/R0});}};

window.frame=function(draw=true){
  tv=f*FDT;const fi=Math.min(f,TL.frames-1),s0=simT;ts=TL.ts[fi];simT=TL.sim[fi];
  if(!started){for(const [ct,lab] of [[0.3,'3'],[1.0,'2'],[1.7,'1']])if(Math.abs(tv-ct)<FDT/2)evA(tv,'count',{n:lab});
    if(tv>=INTRO){started=true;evA(tv,'go');}}
  RP.advance(s0,simT,f?tv-FDT:tv,tv,H);
  ring=sampleArr(REC.ring,REC,simT);spin=sampleArr(REC.spin,REC,simT);
  for(const b of balls){const [x,y]=sample(REC,b.i,simT);b.x=x;b.y=y;}
  const A=alive().length, T=1-(A-1)/Math.max(1,N-1);
  if(started&&!winner){const bpm=116+44*T;beatPhase+=FDT*bpm/60;
    while(beatPhase>=1){beatPhase-=1;const bt=tv-beatPhase/(bpm/60);evA(bt,'beat',{t:+bt.toFixed(4),i:beatIdx,T:+T.toFixed(3),final:A<=2,dur:+(60/bpm).toFixed(4)});beatIdx++;beatPulse=1;}}
  beatPulse*=0.82;
  if(started&&!winner&&A<=3){const rate=A===3?1.35:1.9;hPhase+=FDT*rate;if(hPhase>=1){hPhase-=1;evA(tv,'heart');}hPulse=Math.exp(-hPhase*7)+0.6*Math.exp(-Math.abs(hPhase-0.17)*14);}
  else hPulse*=0.85;
  trauma=Math.max(0,trauma-FDT*1.6);flash*=0.6;
  frames.push({t:+tv.toFixed(4),ts:+ts.toFixed(3),alive:A});
  if(!draw){f++;return {done:f>=TL.frames,t:tv,alive:A};}

  // ---- 3D ----
  const sh=trauma*trauma, shake={x:sh*0.35*(Math.sin(tv*37)+Math.sin(tv*59.3))/2,y:sh*0.35*(Math.sin(tv*43.1)+Math.sin(tv*71.7))/2};
  placeCamera(ring,shake);
  buildFence(ring);ao.scale.setScalar(ring+0.06);
  for(let k=0;k<NS;k++){const a=(k+0.5)/NS*Math.PI*2+spin,m=spikes[k];m.position.copy(W(Math.cos(a)*(ring-0.12),Math.sin(a)*(ring-0.12),0.34));
    m.quaternion.setFromUnitVectors(UPY,W(-Math.cos(a),-Math.sin(a),0).normalize());}
  railMat.emissiveIntensity=0.06+beatPulse*0.04+(A<=3&&!winner?hPulse*0.12:0);
  const Lv=LDIR.clone().transformDirection(camera.matrixWorldInverse);
  const camUp=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1);
  const shOff=new THREE.Vector2(-LDIR.x/LDIR.y,LDIR.z/LDIR.y).multiplyScalar(BR);   // physics-plane offset of the cast shadow
  const shAng=Math.atan2(shOff.y,shOff.x);
  for(const b of balls){b.flash*=0.8;if(!b.alive)continue;
    const q=squash(RP.imp[b.i],simT), cx=b.x+q.nx*b.r*q.s*0.5, cy=b.y+q.ny*b.r*q.s*0.5;   // contact side stays put while the bead flattens
    b.sq={s:q.s,nx:q.nx,ny:q.ny,cx,cy};
    b.warn=b.hp===1&&!winner?(0.5+0.5*Math.sin(tv*14)):0;
    b.contact.position.copy(W(b.x+shOff.x*0.12,b.y+shOff.y*0.12,0.008));b.contact.scale.setScalar(b.r*1.8);
    b.cast.position.copy(W(b.x+shOff.x*0.8,b.y+shOff.y*0.8,0.007));b.cast.rotation.z=shAng;b.cast.scale.set(b.r*3.6,b.r*2.1,1);
    b.caustic.position.copy(W(b.x+shOff.x*1.0,b.y+shOff.y*1.0,0.009));b.caustic.rotation.z=shAng;b.caustic.scale.set(b.r*1.6,b.r*1.0,1);
    b.caustic.material.opacity=0.42*(1-b.warn*0.5);
    if(LOOK==='v3d'){const sy=1+q.s*0.5;b.body.position.copy(W(cx,cy,b.r*sy));b.body.rotation.set(0,Math.atan2(q.ny,q.nx),0);
      b.body.scale.set(b.r*(1-q.s),b.r*sy,b.r*(1+q.s*0.5));b.shell.position.copy(b.body.position);b.shell.rotation.copy(b.body.rotation);b.shell.scale.copy(b.body.scale).multiplyScalar(1.004);
      b.shell.material.uniforms.Lv.value.copy(Lv);b.shell.material.uniforms.uWarn.value=b.warn;b.shell.material.uniforms.uFlash.value=b.flash;
      b.food.position.copy(W(b.x,b.y,b.r)).addScaledVector(camUp,b.r*0.1);b.food.quaternion.copy(camera.quaternion);b.food.scale.setScalar(b.r*1.62);}}
  const pdt=FDT*Math.max(ts,0.15);
  for(let k=0;k<PN;k++){const p=P[k];if(p.life>0){p.life-=pdt;p.vy-=9.8*pdt;p.x+=p.vx*pdt;p.y+=p.vy*pdt;p.z+=p.vz*pdt;
      if(p.y<p.s){p.y=p.s;p.vy*=-0.35;p.vx*=0.7;p.vz*=0.7;}p.rx+=pdt*8;p.ry+=pdt*6;}
    dummy.position.set(p.x,p.y,p.z);dummy.rotation.set(p.rx,p.ry,0);dummy.scale.setScalar(p.life>0?p.s*Math.min(1,p.life/p.max*2):0);dummy.updateMatrix();pMesh.setMatrixAt(k,dummy.matrix);}
  pMesh.instanceMatrix.needsUpdate=true;
  for(const w of rings){if(!w.m.visible)continue;w.t+=pdt*1.5;if(w.t>=1){w.m.visible=false;continue;}w.m.scale.setScalar((0.6+w.t*1.6)*(w.k||1)*BR);w.m.material.opacity=(1-w.t)*0.5;}
  renderer.render(scene,camera);

  // ---- 2D ----
  o.setTransform(1,0,0,1,0,0);o.drawImage(glc,0,0,OW,OH);
  const showBeads=!(winner&&tv-winT>0.9);
  const order=alive().slice().sort((a,b)=>b.y-a.y);   // far (high y) first
  for(const b of order){if(!showBeads)break;const s=b.sq;const [sx,sy,rp]=screenOf(b,s.cx,s.cy,b.r);
    if(LOOK==='v25'){const [ax,ay]=toScreen(W(s.cx+s.nx,s.cy+s.ny,b.r));bead25(sx,sy,rp,b.color,b.icon,{s:s.s,a:Math.atan2(ay-sy,ax-sx)},b.warn,b.flash);}
    // name: inside the bead's lower edge, so it never spills onto a neighbour; hp dots only once damaged
    const fs=Math.max(20,Math.min(rp*0.5,60));let fz=fs;while(fz>16&&textW(b.name,fz)>rp*1.75)fz--;
    txt(b.name,sx,sy+rp*0.6,fz|0,'#ffffff',DISPLAY,'center',Math.max(5,fz*0.26));
    if(b.hp<(duel?2:3)){const tot=duel?2:3;for(let h=0;h<tot;h++){o.beginPath();o.arc(sx+(h-(tot-1)/2)*rp*0.3,sy-rp*0.72,Math.max(5,rp*0.1),0,7);
      o.fillStyle=h<b.hp?(b.hp===1?'#ff2d55':'#ffffff'):'rgba(20,14,40,.75)';o.fill();o.lineWidth=2.5;o.strokeStyle='rgba(0,0,0,.75)';o.stroke();}}}
  if(nearPop&&tv-nearPop.t<0.95&&nearPop.b.alive&&!winner){const nb=nearPop.b,age=tv-nearPop.t,[px,py,pr]=screenOf(nb,nb.x,nb.y,nb.r),
    sc=age<0.12?0.6+age/0.12*0.5:1.1-Math.min(0.1,(age-0.12)*0.3),al=age>0.7?(0.95-age)/0.25:1;
    o.save();o.translate(Math.max(200,Math.min(OW-200,px)),Math.max(330,py-pr*1.7));o.scale(sc,sc);txt('아슬아슬!',0,0,58,'#ffe14d',DISPLAY,'center',12,al);o.restore();}
  // calm vignette; a faint red edge only in the last three
  {const g=o.createRadialGradient(OW/2,ACY,OW*0.45,OW/2,ACY,OH*0.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(${A<=3&&!winner?'60,0,12':'0,0,0'},${BGC.vig+(A<=3&&!winner?hPulse*0.15:0)})`);o.fillStyle=g;o.fillRect(0,0,OW,OH);}
  if(SC.hud!==false)hud(A);
  f++;
  return {done:f>=TL.frames,t:tv,alive:A};
};

// ---------- HUD: short title + count on top, announcements in a strip under the arena ----------
const STRIP_Y=+(qs.get('stripy')||1440);
function strip(a){o.save();o.globalAlpha=a*0.55;o.fillStyle='#05030d';o.beginPath();o.roundRect(60,STRIP_Y-78,OW-120,170,26);o.fill();o.restore();}
function drawDie(bn,age){if(age>1.6)return;const a=age>1.3?(1.6-age)/0.3:1,pop=age<0.12?1.18-age/0.12*0.18:1,
  tier=bn.rank<=3?['#ffd23f','#dfe6ee','#e8955a'][bn.rank-1]:'#ff4d6d';
  const rt=`${bn.rank}위`,nt=`${bn.name} 탈락`,gap=20,iw0=bn.icon?72:0;let rs=80,ns=60;
  const tot0=textW(rt,rs)+gap+(bn.icon?iw0+gap*0.6:0)+textW(nt,ns),k=Math.min(1,(OW-160)/(tot0*1.18));rs*=k;ns*=k;const iw=iw0*k,tot=tot0*k;
  strip(a);o.save();o.translate(OW/2,STRIP_Y-10);o.scale(pop,pop);let x=-tot/2;
  txt(rt,x,0,rs,tier,DISPLAY,'left',12,a);x+=textW(rt,rs)+gap*k;
  if(bn.icon){ico(bn.icon,x+iw/2,0,iw/1.36,a);x+=iw+gap*0.6*k;}
  txt(nt,x,0,ns,vis(bn.color),DISPLAY,'left',10,a);o.restore();
  if(bn.quip){const q=`"${bn.quip}"`,qs2=Math.min(38,38*(OW-160)/Math.max(1,textW(q,38)));txt(q,OW/2,STRIP_Y+60,qs2,'#ffffff',B7,'center',7,a*Math.min(1,Math.max(0,(age-0.2)/0.15)));}}
const CF=Array.from({length:150},()=>({x:crnd(),sp:.55+crnd()*.9,ph:crnd(),sw:crnd()*6,sz:14+crnd()*16,rot:crnd()*6.28,rs:(crnd()-.5)*10,c:['#ffd23f','#ffffff','#ff4d9a','#4cc9f0','#b8ff6a'][(crnd()*5)|0]}));
function hud(A){
  const titleA=winner?Math.max(0,1-(tv-winT)*2):1;
  if(titleA>0){o.save();o.globalAlpha=titleA;
    txt(cfg.title[0],OW/2,84,38,'#b9b0e4',DISPLAY,'center',6);
    txt(cfg.title[1],OW/2,146,66,'#ffe14d',DISPLAY,'center',11);
    if(started){const hot=A<=3&&!winner,sc=hot?1+hPulse*0.12:1,w=430;
      o.save();o.globalAlpha*=0.6;o.fillStyle='#07051a';o.beginPath();o.roundRect(OW/2-w/2,196,w,62,31);o.fill();o.restore();
      o.save();o.translate(OW/2-50,227);o.scale(sc,sc);txt(`남은 ${A}/${N}`,0,0,42,hot?'#ff4d6d':'#ffffff',DISPLAY,'center',7);o.restore();
      txt(`${simT.toFixed(1)}초`,OW/2+140,228,32,'#b9b0e4',B9,'center',6);}
    o.restore();}
  if(!started){const left=Math.ceil(INTRO-0.3-tv+0.7);const k=((tv-0.3)%0.7)/0.7;
    txt(cfg.pick,OW/2,STRIP_Y-20,54,'#ffffff',DISPLAY,'center',11);
    if(tv>=0.3){o.save();o.translate(OW/2,STRIP_Y+120);o.scale(1.4-k*0.4,1.4-k*0.4);txt(String(Math.max(1,Math.min(3,left))),0,0,130,'#ffe14d',DISPLAY,'center',14,1-k*0.5);o.restore();}}
  else if(tv<INTRO+0.6){const k=(tv-INTRO)/0.6;o.save();o.translate(OW/2,STRIP_Y);o.scale(1+k*0.6,1+k*0.6);txt('GO!',0,0,150,'#ffe14d',DISPLAY,'center',16,1-k);o.restore();}
  if(banner&&!winner){const age=tv-banner.t;
    if(banner.kind==='final'&&age<0&&banner.pre)drawDie(banner.pre,tv-banner.pre.t);
    else if(banner.kind==='die')drawDie(banner,age);
    else if(banner.kind==='final'&&age<2.2){const a=Math.min(1,age*4)*(age>1.8?(2.2-age)/0.4:1);strip(a);
      txt('최후의 2개',OW/2,STRIP_Y-12,84,'#ff4d6d',DISPLAY,'center',13,a);txt('HP 2 · 단판 결투',OW/2,STRIP_Y+60,40,'#ffffff',DISPLAY,'center',7,a);}}
  if(winner){const wt=tv-winT,k=Math.min(1,Math.max(0,(wt-0.9)/0.5)),x0=Math.min(1,Math.max(0,(wt-0.9)/0.7))-1,e=Math.max(0,1+2.70158*x0*x0*x0+1.70158*x0*x0);
    if(k>0){o.save();o.globalAlpha=k*0.72;o.fillStyle='#05030d';o.fillRect(0,0,OW,OH);o.restore();
      const cx=OW/2,cy=OH/2-170,R=250*e,fa=Math.max(0,1-(wt-0.9)/0.14)*0.18;
      if(fa>0){o.fillStyle=`rgba(255,255,255,${fa})`;o.fillRect(0,0,OW,OH);}
      if(AS.rays){o.save();o.globalAlpha=k*0.7;o.globalCompositeOperation='lighter';o.translate(cx,cy);o.rotate(wt*0.25);const rs=1050*(0.7+0.3*k);o.drawImage(AS.rays,-rs/2,-rs/2,rs,rs);o.restore();}
      const sw=(wt-0.9)/0.9;if(sw>0&&sw<1){o.save();o.strokeStyle=`rgba(255,214,90,${(1-sw)*0.8})`;o.lineWidth=14*(1-sw)+2;o.beginPath();o.arc(cx,cy,250*(1+sw*1.8),0,7);o.stroke();o.restore();}
      const ca=Math.max(0,Math.min(1,(4.6-wt)/0.9));

      if(R>1){o.save();o.translate(cx,cy+R*1.08);o.scale(1,.22);const g=o.createRadialGradient(0,0,0,0,0,R*1.1);g.addColorStop(0,rgba(winner.color,.45));g.addColorStop(1,rgba(winner.color,0));o.fillStyle=g;o.beginPath();o.arc(0,0,R*1.1,0,7);o.fill();o.restore();
        bead25(cx,cy,R,winner.color,winner.icon,null);}
      const bw=wt-1.3,hop=bw>0&&bw<0.9?Math.abs(Math.sin(bw*3.5))*46*(1-bw/0.9):0;
      emo('👑',cx,cy-R-70-hop,170*Math.min(1,e));
      txt('생존 1위',cx,cy-R-215,72,'#ffffff',DISPLAY,'center',12,k);
      o.save();o.shadowColor=winner.color;o.shadowBlur=40;txt(winner.name,cx,cy+R+115,winner.name.length>3?150:180,'#ffd23f',DISPLAY,'center',16,k);o.restore();
      const kp=Math.min(1,Math.max(0,(wt-2.7)/0.5)),py=cy+R+275,r2=dead.find(d=>d.rank===2),r3=dead.find(d=>d.rank===3);
      if(kp>0){[[r2,'🥈','#dfe6ee',OW/2-250],[r3,'🥉','#e8955a',OW/2+250]].forEach(([d,m,col,px2])=>{if(!d)return;
        o.save();o.globalAlpha=kp;o.translate(px2,py);o.beginPath();o.roundRect(-215,-52,430,104,52);o.fillStyle='rgba(20,12,44,.8)';o.fill();o.lineWidth=4;o.strokeStyle=col;o.stroke();o.restore();
        emo(m,px2-160,py,66,kp);if(d.icon)ico(d.icon,px2-82,py,66,kp);txt(d.name,px2+(d.icon?-28:-80),py,46,vis(d.color),DISPLAY,'left',9,kp);});
        txt(cfg.cta,OW/2,py+150,58,'#ffe14d',DISPLAY,'center',12,kp);}}}
}
