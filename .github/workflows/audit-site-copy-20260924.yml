name: Site copy alignment audit
on:
  push:
    branches: ['audit/site-copy-alignment-20260924']
    paths: ['.github/workflows/audit-site-copy-20260924.yml']
permissions:
  contents: write
concurrency:
  group: site-copy-alignment-20260924
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audited copy changes and build
        run: |
          python tools/_apply_site_copy_20260924.py
          python build_site.py
          python build_site.py --check
          python -m unittest discover -s tests -v
          python tools/check_site.py
      - name: Install browser review tools
        run: |
          python -m pip install 'beautifulsoup4>=4.12,<5' 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Render updated social previews and review the site
        run: |
          python tools/render_social.py
          python tools/browser_check.py --output /tmp/dfb-copy-preview
      - name: Preserve research archive, source evidence, styles and endpoints
        run: |
          set -euo pipefail
          git diff --exit-code b7753fc3d4faab4d90469c59e0543299baf5e785 -- articles.json data/articles.json CNAME google5e69369cc3191f61.html dfb.css newsroom.css research-desk.css site.js img/report001-cover.png img/report001-recon.png img/report001-ladder.png
          python - <<'PY'
          from pathlib import Path
          import subprocess,re
          keep=list(Path('.').glob('case-*.html'))+[Path(n) for n in ['reit-guide.html','bdc-guide.html','industrials-guide.html','telecom-guide.html','reit-what-is-a-reit.html','reit-ffo-vs-eps.html','legal.html','privacy.html','disclaimer.html','Refund.html']]
          for p in keep:
              old=subprocess.check_output(['git','show','b7753fc3d4faab4d90469c59e0543299baf5e785:'+str(p)],text=True)
              new=p.read_text()
              extract=lambda text: re.search(r'<main\b[^>]*>(.*?)</main>',text,re.S).group(1)
              assert extract(old)==extract(new),str(p)+' research/policy body changed'
          print('PASS: all case/sector/policy bodies preserved.')
          PY
      - name: Commit reviewed content on the audit branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' templates build_site.py README.md tools/render_social.py tests/test_site_copy.py 'img/og*.png'
          git diff --cached --stat
          git commit -m 'site: align filing-led copy and pause membership promotion'
          git push origin HEAD:audit/site-copy-alignment-20260924
          git archive --format=tar HEAD > /tmp/dfb-reviewed-site.tar
          git diff b7753fc3d4faab4d90469c59e0543299baf5e785 HEAD > /tmp/dfb-reviewed-site.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dfb-reviewed-site
          path: |
            /tmp/dfb-copy-preview
            /tmp/dfb-reviewed-site.tar
            /tmp/dfb-reviewed-site.diff
          retention-days: 7
