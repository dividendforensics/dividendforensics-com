name: Site copy alignment audit
on:
  push:
    branches: ['audit/site-copy-alignment-20260924']
    paths: ['.github/workflows/audit-site-copy-20260924.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > /tmp/dfb-site-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: dfb-site-source
          path: /tmp/dfb-site-source.tar
          retention-days: 3
