name: Site copy alignment live verification
on:
  push:
    branches: ['audit/site-copy-alignment-20260924']
    paths: ['.github/workflows/audit-site-copy-20260924.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d102c58400371116199279f5f2d453c9b318089c
          persist-credentials: false
      - name: Read live site and compare with approved commit
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import hashlib,json,time,sys
          release='d102c58400371116199279f5f2d453c9b318089c'
          out=Path('/tmp/dfb-live-check');out.mkdir(parents=True,exist_ok=True)
          digest=lambda data:hashlib.sha256(data).hexdigest()
          def fetch(name,attempt=0):
              route='' if name=='index.html' else name
              url='https://dividendforensics.com/'+route+'?dfb_copy='+release+'&attempt='+str(attempt)
              req=Request(url,headers={'User-Agent':'DFB-Publication-Verification/1.0','Cache-Control':'no-cache'})
              with urlopen(req,timeout=30) as response:
                  body=response.read(); status=response.status; final=response.geturl()
              p=out/'public'/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(body)
              return {'path':name,'url':url,'response_url':final,'http_status':status,'expected_sha256':digest(Path(name).read_bytes()),'actual_sha256':digest(body),'matches':body==Path(name).read_bytes()}
          names=sorted(p.name for p in Path('.').glob('*.html') if 'name="dfb-design"' in p.read_text())
          names+=['articles.json','img/og.png','img/og-learn.png','img/og-research.png','img/og-tools.png']
          readiness=[]
          for attempt in range(10):
              try:
                  row=fetch('index.html',attempt);readiness.append(row)
                  if row['matches']:break
              except Exception as e:readiness.append({'attempt':attempt,'error':str(e)})
              time.sleep(15)
          results=[]
          for name in names:
              try:results.append(fetch(name))
              except Exception as e:results.append({'path':name,'matches':False,'error':str(e)})
          ok=all(x['matches'] for x in results)
          report={'commit':release,'result':'PASS' if ok else 'FAIL','live_get_requests_only':True,'forms_submitted':False,'payment_actions':False,'files_checked':len(results),'results':results,'readiness_attempts':readiness}
          (out/'LIVE_SITE_CHECK.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2));sys.exit(0 if ok else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dfb-live-site-verification
          path: /tmp/dfb-live-check
          retention-days: 7
