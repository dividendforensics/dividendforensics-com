name: Design review
on:
  push:
    branches: ['design/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA tools
        run: |
          python -m pip install 'beautifulsoup4>=4.12,<5' 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Validate and render the complete site
        run: |
          python build_site.py --check
          python -m unittest discover -s tests -v
          python tools/check_site.py
          python tools/seo_audit.py
          node --test tests/*.test.cjs
          python tools/proposal_browser_check.py
          python tools/education_browser_check.py
          python tools/audit_browser_check.py
          python tools/bdc_education_browser_check.py
          python tools/spanish_browser_check.py
          python tools/precision_browser_check.py
          python tools/resources_browser_check.py
          python tools/lesson_formats_browser_check.py
          python tools/browser_check.py --output /tmp/dfb-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dfb-design-preview
          path: /tmp/dfb-preview
          retention-days: 14
