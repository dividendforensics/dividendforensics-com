name: Validate main release
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'img/**'
      - 'templates/**'
      - 'articles.json'
      - 'build_site.py'
      - 'education.py'
      - 'lesson_formats.py'
      - 'research_resources.py'
      - 'filing_labs.py'
      - 'operating_companies.py'
      - 'operating_filing_lab.py'
      - 'bdc_education.py'
      - 'localized.py'
      - 'international.py'
      - 'international.css'
      - 'international-calculators.js'
      - 'de/**'
      - 'ja/**'
      - 'zh-hant/**'
      - 'es/**'
      - 'curriculum.py'
      - '*_tools.py'
      - 'vendor/**'
      - 'scripts/**'
      - 'content/**'
      - 'sitemap.xml'
      - 'ads.txt'
      - 'tests/**'
      - 'tools/check_site.py'
      - 'tools/seo_audit.py'
      - '.github/workflows/main.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-site-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML test dependency
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Validate the committed release
        run: |
          python build_site.py --check
          python -m unittest discover -s tests -v
          python tools/check_site.py
          python tools/seo_audit.py
          node --test tests/*.test.cjs
