name: Build and publish research site
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'img/**'
      - 'templates/**'
      - 'articles.json'
      - 'build_site.py'
      - 'education.py'
      - 'lesson_formats.py'
      - 'research_resources.py'
      - 'bdc_education.py'
      - 'localized.py'
      - 'international.py'
      - 'international.css'
      - 'international-calculators.js'
      - 'de/**'
      - 'ja/**'
      - 'zh-hant/**'
      - 'es/**'
      - 'curriculum.py'
      - '*_tools.py'
      - 'vendor/**'
      - 'scripts/**'
      - 'content/**'
      - 'sitemap.xml'
      - 'ads.txt'
      - 'tests/**'
      - 'tools/check_site.py'
      - 'tools/seo_audit.py'
      - '.github/workflows/main.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: build-site-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML test dependency
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Build and validate before writing a release
        run: |
          python build_site.py
          python -m unittest discover -s tests -v
          python tools/check_site.py
          python tools/seo_audit.py
          python build_site.py --check
          node --test tests/*.test.cjs
      - name: Commit generated HTML only when needed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- '*.html' sitemap.xml)" ]; then
            echo 'Generated pages are already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.html' sitemap.xml
            git commit -m 'build: synchronize research records and shared site chrome'
            git push origin HEAD:main
          fi
      - name: Request branch-based Pages build explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
