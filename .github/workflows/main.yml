name: Build article listings

on:
  push:
    branches: [main]
    paths:
      - 'articles.json'
      - 'build_site.py'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild from articles.json
        run: python build_site.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- index.html research.html research-desk.html)" ]; then
            echo "변경 없음. 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html research.html research-desk.html
          git commit -m "Rebuild article listings from articles.json"
          git push
